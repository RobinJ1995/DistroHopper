name: CI

on:
  push:
    branches: [ master, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v3.0.1 — a single trailing letter (v3.0.1a) publishes a pre-release'
        required: true
        type: string

jobs:
  # Single source of truth for "is this a release, and which version is it".
  #
  # On workflow_dispatch this also bumps app/build.gradle, commits it to master
  # and tags that commit, so the release jobs below build the tagged bump commit
  # within this same run. It has to happen in one run: a tag pushed with
  # GITHUB_TOKEN cannot start a new workflow run, so there is no second,
  # tag-triggered run to fall back on. Manually pushing a v* tag still works
  # exactly as before, tests and all.
  release-context:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the version bump commit and the release tag
    outputs:
      release: ${{ steps.context.outputs.release }}
      tag: ${{ steps.context.outputs.tag }}
      run_tests: ${{ steps.context.outputs.run_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A dispatch can be started from any ref, but releases always come off
          # master. fetch-tags so the "already released?" check below can see them.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate requested version
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The checkout below swaps in master's *contents*, but GitHub already
          # picked this workflow's definition from the ref chosen in the Run
          # workflow UI. Releasing from anywhere else would run that ref's
          # release logic — with contents:write — against master's code.
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Releases must be dispatched from master, not ${GITHUB_REF#refs/heads/}."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)[a-z]?$ ]]; then
            echo "::error::'$TAG' is not a valid version. Expected vMAJOR.MINOR.PATCH, optionally with one trailing lowercase letter for a beta — e.g. v3.0.1 or v3.0.1a."
            exit 1
          fi
          # An existing tag means a previous run bumped and pushed but failed
          # later on; that is resumable. Judge it by what the tag *contains*,
          # not by where master is now — master may have moved on since, and
          # the release job checks out the tag rather than the branch anyway.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # A tag can be created from anywhere. Releases come off master, and
            # resuming skips the tests, so an unreachable tag would publish a commit
            # that was never on master and was never tested.
            if ! git merge-base --is-ancestor "refs/tags/$TAG^{commit}" HEAD; then
              echo "::error::Tag $TAG is not reachable from master — releases must come from master."
              exit 1
            fi
            # Only the newest release is resumable. Re-running an older one would
            # reuse the current appVersionCode and drag the release attachments
            # back to a superseded build.
            newest="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+[a-z]?$' | sort -V | tail -1)"
            if [ "$newest" != "$TAG" ]; then
              echo "::error::Tag $TAG is superseded by $newest — only the most recent release can be resumed. Cut a new version instead."
              exit 1
            fi
            if ! git show "$TAG:app/build.gradle" 2>/dev/null \
                 | grep -qE "^def baseVersionName = \"${TAG#v}\"\$"; then
              echo "::error::Tag $TAG already exists but its commit does not set baseVersionName to ${TAG#v} — pick a version that has not been released."
              exit 1
            fi
            echo "::notice::Tag $TAG already exists and carries version ${TAG#v}; resuming a previous release run without re-tagging."
            echo "RELEASE_RESUME=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_RESUME=false" >> "$GITHUB_ENV"
          fi

      - name: Bump version, commit and tag
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_RESUME != 'true'
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          # versionCode must increase monotonically or Android refuses the upgrade.
          current_code="$(grep -oP '^def appVersionCode = \K[0-9]+' app/build.gradle)"
          sed -i -E "s/^def appVersionCode = [0-9]+$/def appVersionCode = $((current_code + 1))/" app/build.gradle
          sed -i -E "s/^def baseVersionName = \".*\"$/def baseVersionName = \"${version}\"/" app/build.gradle

          # Fail loudly rather than releasing an unbumped build.
          grep -qE "^def baseVersionName = \"${version}\"\$" app/build.gradle || {
            echo "::error::Failed to set baseVersionName to ${version} in app/build.gradle."
            exit 1
          }
          grep -qE "^def appVersionCode = $((current_code + 1))\$" app/build.gradle || {
            echo "::error::Failed to increment appVersionCode to $((current_code + 1)) in app/build.gradle."
            exit 1
          }
          grep -E '^def (appVersionCode|baseVersionName) ' app/build.gradle

          # Attribute the bump to the repo owner, matching every other hand-made
          # commit here, rather than to the Actions bot.
          git config user.name 'Robin Jacobs'
          git config user.email 'RobinJ1995@users.noreply.github.com'
          git add app/build.gradle
          # Re-releasing a version already present in the file is a no-op commit-wise;
          # the tag still needs to land on master's tip.
          git diff --cached --quiet || git commit -m "$TAG"
          git tag -a "$TAG" -m "$TAG"
          # --atomic: either both refs land or neither does. A half-push would
          # leave master bumped but unreleased, and the GITHUB_TOKEN branch push
          # starts no CI run that would make that visible.
          git push --atomic origin HEAD:master "refs/tags/$TAG"

      - name: Resolve release context
        id: context
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Nothing about the code changed, so the tests that already passed on
            # master still hold — go straight to building the release.
            printf 'release=true\ntag=%s\nrun_tests=false\n' "$TAG" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            printf 'release=true\ntag=%s\nrun_tests=true\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            printf 'release=false\ntag=\nrun_tests=true\n' >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    needs: release-context
    if: needs.release-context.outputs.run_tests == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Create secret.properties
        run: |
          echo "acra_username=" > secret.properties
          echo "acra_password=" >> secret.properties

      - name: Run unit tests and coverage
        run: ./gradlew jacocoTestReport

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-coverage
          path: app/build/reports/jacoco/jacocoTestReport/

  # Build signed APK + AAB for a release, gated on the unit tests.
  #
  # The status functions matter: on a dispatch run unit-tests is *skipped*, and a
  # skipped dependency would skip this job too under the implicit success().
  # !cancelled() && !failure() drops that implicit check while still refusing to
  # release if unit-tests actually ran and failed.
  release:
    if: ${{ !cancelled() && !failure() && needs.release-context.outputs.release == 'true' }}
    needs: [ release-context, unit-tests ]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create/attach the GitHub Release on tags

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # On a dispatch the triggering SHA predates the version bump, so build
          # the tag release-context just created rather than the default checkout.
          ref: refs/tags/${{ needs.release-context.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Require signing secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to build a release without the keystore."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # PKCS12 uses one password for both the store and the key entry.
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$STORE_PASSWORD"
          } > key.properties

      - name: Create secret.properties
        env:
          ACRA_USERNAME: ${{ secrets.ACRA_USERNAME }}
          ACRA_PASSWORD: ${{ secrets.ACRA_PASSWORD }}
        run: |
          echo "acra_username=${ACRA_USERNAME}" > secret.properties
          echo "acra_password=${ACRA_PASSWORD}" >> secret.properties

      - name: Set release artifact version
        env:
          TAG: ${{ needs.release-context.outputs.tag }}
        run: echo "RELEASE_VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify APK is release-signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Stage release APK and AAB
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifacts"
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/release-artifacts/DistroHopper-$RELEASE_VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "$RUNNER_TEMP/release-artifacts/DistroHopper-$RELEASE_VERSION.aab"

      - name: Disable ACRA credentials for paranoia build
        run: |
          echo "acra_username=" > secret.properties
          echo "acra_password=" >> secret.properties

      - name: Build signed paranoia APK
        run: ./gradlew clean assembleRelease -PparanoiaBuild=true

      - name: Verify paranoia APK is release-signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Stage paranoia APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/release-artifacts/DistroHopper-$RELEASE_VERSION-paranoia.apk"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: distrohopper-release-android
          path: |
            ${{ runner.temp }}/release-artifacts/DistroHopper-${{ env.RELEASE_VERSION }}.apk
            ${{ runner.temp }}/release-artifacts/DistroHopper-${{ env.RELEASE_VERSION }}.aab
            ${{ runner.temp }}/release-artifacts/DistroHopper-${{ env.RELEASE_VERSION }}-paranoia.apk

      - name: Detect release type
        id: release_metadata
        run: |
          if [[ "$RELEASE_VERSION" =~ [[:alpha:]]$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<RELEASE_BODY"
              echo "> [!WARNING]"
              echo "> Test version, not a stable release"
              echo "RELEASE_BODY"
            } >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "body=" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit: on a dispatch run github.ref is a branch, so the tag cannot
          # be inferred from it.
          tag_name: ${{ needs.release-context.outputs.tag }}
          prerelease: ${{ steps.release_metadata.outputs.prerelease }}
          append_body: true
          body: ${{ steps.release_metadata.outputs.body }}
          files: |
            ${{ runner.temp }}/release-artifacts/DistroHopper-${{ env.RELEASE_VERSION }}.apk
            ${{ runner.temp }}/release-artifacts/DistroHopper-${{ env.RELEASE_VERSION }}.aab
            ${{ runner.temp }}/release-artifacts/DistroHopper-${{ env.RELEASE_VERSION }}-paranoia.apk

      - name: Clean up secrets
        if: always()
        run: rm -f key.properties "$RUNNER_TEMP/upload-keystore.jks"

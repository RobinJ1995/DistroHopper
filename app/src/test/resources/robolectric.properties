# Every API level the app supports (minSdk..compileSdk). A run narrows this to
# one via -ProbolectricSdk; keep in step with the CI matrix. See AGENTS.md.
sdk=31,32,33,34,35,36
# A modern phone screen (≈360×800dp portrait, xxhdpi/3x density) rather than
# Robolectric's tiny 320×480dp mdpi default, so WidgetGrid.init() derives a
# realistic grid (8×17) and the whole suite runs against representative
# dimensions and density.
qualifiers=sw360dp-w360dp-h800dp-xxhdpi

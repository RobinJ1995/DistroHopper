apply plugin: 'com.android.application'
apply plugin: 'jacoco'

jacoco {
    toolVersion = '0.8.13'
}

def properties = new Properties()
def secretFile = rootProject.file("secret.properties")
if (secretFile.exists()) {
    properties.load(new FileInputStream(secretFile))
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def paranoiaBuild = providers.gradleProperty("paranoiaBuild")
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def appVersionCode = 111
def baseVersionName = "3.0.0"

android {
    namespace "be.robinj.distrohopper"
    compileSdk 36
    defaultConfig {
        applicationId "be.robinj.distrohopper"
        minSdk 31
        targetSdk 36
        versionCode appVersionCode
        versionName paranoiaBuild ? "${baseVersionName}-paranoia" : baseVersionName
        buildConfigField "String", "ACRA_USERNAME", "\"" + (properties['acra_username'] ?: "") + "\""
        buildConfigField "String", "ACRA_PASSWORD", "\"" + (properties['acra_password'] ?: "") + "\""
        def acraConfigured = !paranoiaBuild && ((properties['acra_username'] ?: "") != "") && ((properties['acra_password'] ?: "") != "")
        buildConfigField "boolean", "ACRA_CONFIGURED", acraConfigured.toString()
        buildConfigField "boolean", "PARANOIA_BUILD", paranoiaBuild.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Sign release builds only when a keystore is provided, so local
            // and CI test builds without one still succeed.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    dependenciesInfo {
        includeInApk = !paranoiaBuild
        includeInBundle = true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true

            all {
                jacoco.includeNoLocationClasses = true
                jacoco.excludes = ['jdk.internal.*']
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
    }
    sourceSets {
        main {
            // The licence texts are shipped inside the APK, not just kept in the
            // repository: the SIL OFL and the Ubuntu Font Licence both require the
            // licence to travel with the fonts, and whoever installs a build from
            // the Play Store never sees the repository. Staged into a generated
            // folder by copyLicenseAssets below so there is exactly one copy of
            // each text under version control.
            assets.srcDirs += "$buildDir/generated/licenseAssets"

            // British English under a locale qualifier, staged by
            // copyEnWorldStrings below.
            res.srcDirs += "$buildDir/generated/enWorldRes"
        }
    }
}

// Stages the repository's licence texts (plus the app's own GPLv3) where the
// asset merger can pick them up, under assets/licenses/. LicensesActivity reads
// them back out by those paths.
//
// Sync rather than Copy: Sync deletes anything in the destination that no
// longer has a source, so a licence text that gets deleted or renamed stops
// being packaged on the next incremental build instead of lingering until
// someone happens to run a clean build. Its own generated directory, so
// there is nothing else there to delete.
def copyLicenseAssets = tasks.register('copyLicenseAssets', Sync) {
    into "$buildDir/generated/licenseAssets/licenses"

    from(rootProject.file('licenses'))
    from(rootProject.file('LICENSE')) {
        rename '.*', 'gpl-3.0.txt'
    }
}

// The same British strings the app already ships, under a locale qualifier.
//
// res/values/strings.xml is written in British English -- it is Transifex's
// en_GB source -- but carries no locale qualifier, so Android cannot tell it
// apart from "the last resort". American English is a translation like any
// other, in values-en-rUS. A device set to English (Ireland) therefore resolves
// en-IE -> en-001 -> en, matches none of them, falls back to "any resources
// with the same language", and lands on the American set: "Customize" and
// "Color" on an Irish phone. en-001 ("world English") is the CLDR parent of
// en-IE/en-GB/en-AU/en-IN/en-ZA, so the same strings under values-b+en+001 are
// matched by all of them, while en-US keeps matching values-en-rUS.
//
// res/xml/locales_config.xml says the same thing declaratively via
// android:defaultLocale, but that attribute is API 35+ and minSdk is 31, so it
// covers Android 15 and up only. This covers every supported version.
//
// Generated rather than committed because it is a byte-for-byte copy of the
// source strings, and a duplicate maintained by hand drifts. Transifex cannot
// maintain it either: tx pull skips the source language before the --languages
// filter applies, and --source writes back to source_file.
def copyEnWorldStrings = tasks.register('copyEnWorldStrings', Sync) {
    into "$buildDir/generated/enWorldRes/values-b+en+001"

    from(file('src/main/res/values/strings.xml')) {
        rename '.*', 'translations.xml'
    }
}

// preBuild rather than the merge*Assets/merge*Resources tasks: it is a stable,
// public task name that every variant already depends on.
tasks.named('preBuild') { dependsOn copyLicenseAssets, copyEnWorldStrings }

repositories {
    maven {
        url "http://repo.commonsware.com.s3.amazonaws.com"
        allowInsecureProtocol = true
    }
}

dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'asia.ivity.android:drag-sort-listview:1.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // ACRA
    def acraVersion = '5.13.1'
    implementation "ch.acra:acra-http:$acraVersion"
    implementation "ch.acra:acra-toast:$acraVersion"

    // Robolectric – runs on the JVM, no emulator needed
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    testImplementation 'androidx.test.espresso:espresso-intents:3.7.0'

    // Minimal androidTest runner kept for any future on-device tests
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
    }

    def exclusions = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/thirdparty/**'
    ]

    classDirectories.setFrom(files(
        fileTree(dir: "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: exclusions),
        fileTree(dir: "$buildDir/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes", excludes: exclusions)
    ))
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(fileTree(buildDir) {
        include 'jacoco/testDebugUnitTest.exec'
        include 'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
    })
}
